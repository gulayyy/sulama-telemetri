services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sulama
      POSTGRES_PASSWORD: sulama123
      POSTGRES_DB: telemetri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulama -d telemetri"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    environment:
      PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: sulama
      PGPASSWORD: sulama123
      PGDATABASE: telemetri
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: farm/sensors/+
      MOISTURE_THRESHOLD: 25
      JWT_SECRET: degistirilmesi-gereken-gizli-anahtar
      JWT_EXPIRES_IN: 8h
      ADMIN_USER: admin
      ADMIN_PASSWORD: sulama123
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      SIM_PERIOD_MS: 10000
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Tarayıcı host makinede çalışır; bu yüzden servis adı değil
        # yayınlanan port kullanılır.
        VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
